# Define donde Ansible ejecutara las tareas 
# Direcciones de las mv, para que ansible pueda conectarse a las mv y aplicar la configuracion

#Defino master
[masters]                                                                                                                                                                                                      
master ansible_host=192.168.56.10 ansible_ssh_private_key_file=.vagrant/machines/master/virtualbox/private_key  

#Defino los nodos workers
[workers]                                                                                                                                                                                                     
worker1 ansible_host=192.168.56.11 ansible_ssh_private_key_file=.vagrant/machines/worker1/virtualbox/private_key                                                                                              
worker2 ansible_host=192.168.56.12 ansible_ssh_private_key_file=.vagrant/machines/worker2/virtualbox/private_key 

#Define el cluster
[cluster:children]
masters
workers

#Define variables globales para todos los nodos
#Define usuario vagrant y ruta de la clave privada de vagrant para conectarse por ssh
[all:vars]
ansible_user=vagrant

